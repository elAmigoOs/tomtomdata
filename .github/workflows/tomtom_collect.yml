name: Collect TomTom Traffic Data (Jeddah)

# Triggered every 30 minutes by cron-job.org (workflow_dispatch).
# TomTom's free limits are MONTHLY: 20,000 flow / 2,500 incident requests.
# Every 30 min = 1,488 runs in a 31-day month -> 14,880 flow + 1,488 incident
# requests (python tomtom_collector.py --budget).
# Each run collects:
#   1. traffic flow for the 10 monitored points  -> jeddah_tomtom_flow.csv
#      (fails the run, red, if 0 rows were written)
#   2. traffic incidents in the same area (1 request) -> jeddah_incidents.csv
#                                                        jeddah_incidents_runs.csv

on:
  workflow_dispatch:

# Stops two overlapping runs from both writing the CSVs and conflicting.
concurrency:
  group: tomtom-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Collect traffic flow
        env:
          TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}
        run: python tomtom_collector.py --once

      # If the incidents request fails, the flow data is still committed.
      - name: Collect traffic incidents
        continue-on-error: true
        env:
          TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}
        run: python tomtom_incidents.py

      - name: Commit the new rows
        run: |
          git config user.name "masar-collector"
          git config user.email "actions@github.com"
          git add jeddah_tomtom_flow.csv
          git add jeddah_incidents.csv jeddah_incidents_runs.csv 2>/dev/null || true
          git diff --cached --quiet && echo "nothing new" && exit 0
          git commit -m "Traffic data $(date -u +'%Y-%m-%d %H:%M UTC')"
          # Another run may have pushed while we worked - rebase and retry.
          for i in 1 2 3; do
            git pull --rebase --autostash origin ${{ github.ref_name }} && git push && exit 0
            sleep 5
          done
          echo "push failed after retries" && exit 1
